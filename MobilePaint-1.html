<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MobilePaint</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202124;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{touch-action:none;color:#fff}
#app{height:100%;display:flex;flex-direction:column}
#top{height:158px;min-height:158px;background:#292a2d;border-bottom:1px solid #444;display:flex;flex-direction:column;overflow:hidden}
#topMain{height:58px;min-height:58px;display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid #444;white-space:nowrap;overflow:hidden}
#tools{height:100px;min-height:100px;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:2px 8px;overflow:hidden}
.toolRow{height:47px;min-height:47px;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow-x:auto}
.toolRow button{flex:0 0 42px;width:42px}
#title{font-weight:700;font-size:17px;white-space:nowrap;margin-right:3px}
#madeBy{margin-left:auto;color:#aaa;font-size:12px;white-space:nowrap;padding-left:5px}
button,.select{height:42px;-webkit-appearance:none;appearance:none;min-width:42px;border:1px solid #555;border-radius:9px;background:#3a3b3f;color:#fff;font-size:16px;padding:0 10px}
button:active{transform:scale(.96);background:#505158}
button.active{background:#1769aa;border-color:#5db7ff}
#file{display:none}
#workspace{position:relative;flex:1;overflow:hidden;background:#18191b;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#imgCanvas,#drawCanvas{position:absolute;left:0;top:0;display:block;touch-action:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#aaa;padding:30px;font-size:18px;pointer-events:none}
#bottom{height:calc(100px + env(safe-area-inset-bottom));padding-bottom:calc(4px + env(safe-area-inset-bottom));min-height:100px;background:#292a2d;border-top:1px solid #444;display:flex;flex-direction:column;padding:4px 8px;gap:4px}
#bottomRow1,#bottomRow2{height:44px;min-height:44px;display:flex;align-items:center}
#bottomRow2{gap:6px}
.controlGroup{display:flex;align-items:center;gap:7px;width:100%}
#color{width:42px;height:38px;padding:3px}
#size{width:120px;max-width:35vw}
#sizeVal{min-width:20px;text-align:center;font-size:13px;color:#ccc}
#bottomRow2 button{height:38px;min-width:42px}
@media(max-width:600px){
  #topMain{gap:4px;padding:5px 6px}
  #tools{gap:2px;padding:2px 6px}
  .toolRow{gap:3px}
  .toolRow button{padding:0;width:42px;min-width:42px;flex:0 0 42px}
  #title{font-size:14px;flex:0 0 auto}
  #madeBy{font-size:9px;flex:0 0 auto}
  #topMain button{font-size:12px;padding:0 6px;flex:0 0 auto}
  #tools #clear{font-size:18px}
  #bottom{height:96px;min-height:96px;padding:3px 6px}
  #bottomRow1,#bottomRow2{height:43px;min-height:43px}
  #size{width:105px}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="topMain">
      <div id="title">JYP 그리기툴</div>
      <button id="openBtn">📂 열기</button>
      <button id="newBtn">📄 새로 그리기</button>
      <button id="save" style="background:#176b42">💾 다른이름저장</button>
      <div id="madeBy">made by JYP</div>
      <input id="file" type="file" accept="image/*">
    </div>
    <div id="tools">
      <div class="toolRow">
        <button data-tool="pen" class="tool active">✏️</button>
        <button data-tool="line" class="tool">／</button>
        <button data-tool="circle" class="tool">○</button>
        <button data-tool="rect" class="tool">□</button>
        <button data-tool="arrow" class="tool">➜</button>
        <button data-tool="text" class="tool">T</button>
      </div>
      <div class="toolRow">
        <button data-tool="eraser" class="tool">🧹</button>
        <button id="undo">↶</button>
        <button id="redo">↷</button>
        <button id="clear" aria-label="전체 지우기" title="전체 지우기">🧽</button>
      </div>
    </div>
  </div>
  <div id="workspace">
    <div id="empty">이미지를 열어 주세요</div>
    <div id="stage">
      <canvas id="imgCanvas"></canvas>
      <canvas id="drawCanvas"></canvas>
    </div>
  </div>
  <div id="bottom">
    <div id="bottomRow1">
      <div class="controlGroup">
        <span>색상</span>
        <input id="color" type="color" value="#ff2d2d" title="색상">
        <span>굵기</span>
        <input id="size" type="range" min="1" max="30" value="5">
        <span id="sizeVal">5</span>
      </div>
    </div>
    <div id="bottomRow2">
      <button id="fit">화면맞춤</button>
      <button id="zoomOut">−</button>
      <button id="zoomIn">＋</button>
    </div>
  </div>
</div>

<script>
(() => {
  const workspace = document.getElementById('workspace');
  const stage = document.getElementById('stage');
  const imgCanvas = document.getElementById('imgCanvas');
  const drawCanvas = document.getElementById('drawCanvas');
  const ictx = imgCanvas.getContext('2d');
  const ctx = drawCanvas.getContext('2d');
  const empty = document.getElementById('empty');
  const file = document.getElementById('file');
  const color = document.getElementById('color');
  const size = document.getElementById('size');
  const sizeVal = document.getElementById('sizeVal');

  let W=0,H=0, zoom=1, panX=0, panY=0;
  let tool='pen', drawing=false, start=null, last=null, currentPath=[];
  let undoStack=[], redoStack=[];
  let imageLoaded=false;
  let pointers=new Map(), pinchStart=null;

  function setCanvasSize(w,h){
    W=w; H=h;
    [imgCanvas,drawCanvas].forEach(c=>{c.width=w;c.height=h;c.style.width=w+'px';c.style.height=h+'px'});
    stage.style.width=w+'px'; stage.style.height=h+'px';
  }
  function clearDraw(){ctx.clearRect(0,0,W,H)}
  function snapshot(){return ctx.getImageData(0,0,W,H)}
  function pushUndo(){
    if(!imageLoaded)return;
    undoStack.push(snapshot());
    if(undoStack.length>30)undoStack.shift();
    redoStack=[];
  }
  function restore(img){ctx.clearRect(0,0,W,H);ctx.putImageData(img,0,0)}
  function updateZoom(){stage.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`}
  function fit(){
    if(!imageLoaded)return;
    const r=workspace.getBoundingClientRect();
    const z=Math.min((r.width-20)/W,(r.height-20)/H);
    zoom=Math.max(.05,Math.min(1,z)); panX=(r.width-W*zoom)/2; panY=(r.height-H*zoom)/2; updateZoom();
  }
  function screenToImage(x,y){
    return {x:(x-panX)/zoom,y:(y-panY)/zoom}
  }
  function setupStroke(){
    ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=color.value;ctx.fillStyle=color.value;
    ctx.lineWidth=+size.value;
  }
  function drawArrow(a,b){
    const ang=Math.atan2(b.y-a.y,b.x-a.x), len=Math.max(12,+size.value*4);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.beginPath();ctx.moveTo(b.x,b.y);
    ctx.lineTo(b.x-len*Math.cos(ang-Math.PI/6),b.y-len*Math.sin(ang-Math.PI/6));
    ctx.moveTo(b.x,b.y);
    ctx.lineTo(b.x-len*Math.cos(ang+Math.PI/6),b.y-len*Math.sin(ang+Math.PI/6));ctx.stroke();
  }
  function preview(a,b){
    restore(undoStack[undoStack.length-1] || snapshotBase);
    setupStroke();
    if(tool==='line') {ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
    else if(tool==='circle'){const rx=Math.abs(b.x-a.x),ry=Math.abs(b.y-a.y);ctx.beginPath();ctx.ellipse(a.x+(b.x-a.x)/2,a.y+(b.y-a.y)/2,rx/2,ry/2,0,0,Math.PI*2);ctx.stroke()}
    else if(tool==='rect'){ctx.strokeRect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(b.x-a.x),Math.abs(b.y-a.y))}
    else if(tool==='arrow')drawArrow(a,b);
  }
  let snapshotBase=null;

  function pointerPos(e){const r=workspace.getBoundingClientRect();return screenToImage(e.clientX-r.left,e.clientY-r.top)}
  function down(e){
    if(!imageLoaded)return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===2){drawing=false; start=null; pinchStart={dist:distance(),zoom,panX,panY};return}
    if(e.pointerType==='mouse' && e.button!==0)return;
    const p=pointerPos(e); start=p;last=p; drawing=true;
    if(tool==='pen'){pushUndo(); setupStroke();ctx.beginPath();ctx.moveTo(p.x,p.y)}
    else if(tool==='eraser'){pushUndo();ctx.save();ctx.globalCompositeOperation='destination-out';ctx.lineWidth=+size.value*3;ctx.beginPath();ctx.moveTo(p.x,p.y)}
    else if(['line','circle','rect','arrow'].includes(tool)){pushUndo();snapshotBase=undoStack[undoStack.length-1]}
    else if(tool==='text'){
      pushUndo(); const t=prompt('입력할 글자를 적어주세요');
      if(t){setupStroke();ctx.font=`${Math.max(14,+size.value*5)}px sans-serif`;ctx.fillText(t,p.x,p.y)}
      drawing=false;
    }
    e.preventDefault();
  }
  function move(e){
    if(!pointers.has(e.pointerId))return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===2 && pinchStart){
      const d=distance(); zoom=Math.max(.05,Math.min(8,pinchStart.zoom*d/pinchStart.dist));
      updateZoom(); return;
    }
    if(!drawing)return;
    const p=pointerPos(e);
    if(tool==='pen'){ctx.lineTo(p.x,p.y);ctx.stroke()}
    else if(tool==='eraser'){ctx.lineTo(p.x,p.y);ctx.stroke()}
    else if(['line','circle','rect','arrow'].includes(tool)){restore(snapshotBase);preview(start,p)}
    last=p;e.preventDefault();
  }
  function up(e){
    pointers.delete(e.pointerId);
    if(pointers.size<2)pinchStart=null;
    if(!drawing)return;
    if(tool==='eraser')ctx.restore();
    if(['line','circle','rect','arrow'].includes(tool)){restore(snapshotBase);setupStroke();if(tool==='line'){ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.lineTo(last.x,last.y);ctx.stroke()}else if(tool==='circle'){const rx=Math.abs(last.x-start.x),ry=Math.abs(last.y-start.y);ctx.beginPath();ctx.ellipse(start.x+(last.x-start.x)/2,start.y+(last.y-start.y)/2,rx/2,ry/2,0,0,Math.PI*2);ctx.stroke()}else if(tool==='rect')ctx.strokeRect(Math.min(start.x,last.x),Math.min(start.y,last.y),Math.abs(last.x-start.x),Math.abs(last.y-start.y));else drawArrow(start,last)}
    drawing=false;start=null;last=null;
  }
  function distance(){const a=[...pointers.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}

  function createBlank(){
    const w=1600, h=1200;
    setCanvasSize(w,h);
    ictx.clearRect(0,0,W,H);
    ictx.fillStyle='#ffffff';
    ictx.fillRect(0,0,W,H);
    clearDraw();
    undoStack=[]; redoStack=[];
    imageLoaded=true;
    empty.style.display='none';
    fit();
  }

  document.getElementById('openBtn').onclick=()=>file.click();
  document.getElementById('newBtn').onclick=createBlank;
  file.onchange=()=>{
    const f=file.files[0]; if(!f)return;
    const url=URL.createObjectURL(f), im=new Image();
    im.onload=()=>{
      const max=5000, s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
      setCanvasSize(Math.round(im.naturalWidth*s),Math.round(im.naturalHeight*s));
      ictx.clearRect(0,0,W,H);ictx.drawImage(im,0,0,W,H);clearDraw();
      undoStack=[];redoStack=[];imageLoaded=true;empty.style.display='none';fit();URL.revokeObjectURL(url);
    };
    im.src=url;
  };
  document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');tool=b.dataset.tool});
  size.oninput=()=>sizeVal.textContent=size.value;
  document.getElementById('undo').onclick=()=>{if(!undoStack.length)return;redoStack.push(snapshot());restore(undoStack.pop())};
  document.getElementById('redo').onclick=()=>{if(!redoStack.length)return;undoStack.push(snapshot());restore(redoStack.pop())};
  document.getElementById('clear').onclick=()=>{if(!imageLoaded)return;if(confirm('그림을 모두 지울까요?')){pushUndo();clearDraw()}};
  document.getElementById('fit').onclick=fit;
  document.getElementById('zoomIn').onclick=()=>{zoom=Math.min(8,zoom*1.2);updateZoom()};
  document.getElementById('zoomOut').onclick=()=>{zoom=Math.max(.05,zoom/1.2);updateZoom()};
  document.getElementById('save').onclick=async()=>{
    if(!imageLoaded)return;
    const out=document.createElement('canvas');out.width=W;out.height=H;
    const o=out.getContext('2d');
    o.drawImage(imgCanvas,0,0);o.drawImage(drawCanvas,0,0);

    out.toBlob(async blob=>{
      if(!blob)return;
      const filename='MobilePaint_'+new Date().toISOString().slice(0,10)+'.png';

      // iPhone/iPad Safari: use the native Share Sheet when supported.
      try{
        const shareFile=new File([blob],filename,{type:'image/png'});
        if(navigator.share && (!navigator.canShare || navigator.canShare({files:[shareFile]}))){
          await navigator.share({files:[shareFile],title:'MobilePaint'});
          return;
        }
      }catch(err){
        // User cancellation or unsupported share: continue to the download fallback.
      }

      // Android/desktop and Safari fallback.
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download=filename;
      a.rel='noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();

      // Some iOS Safari versions handle blob downloads better by opening the image.
      if(/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream){
        setTimeout(()=>{
          try{ window.open(url,'_blank'); }catch(e){}
        },150);
      }
      setTimeout(()=>URL.revokeObjectURL(url),10000);
    },'image/png');
  };
  workspace.addEventListener('pointerdown',down,{passive:false});
  workspace.addEventListener('pointermove',move,{passive:false});
  workspace.addEventListener('pointerup',up,{passive:false});
  workspace.addEventListener('pointercancel',up,{passive:false});
  window.addEventListener('resize',()=>{if(imageLoaded)fit()});
  window.addEventListener('orientationchange',()=>setTimeout(()=>{if(imageLoaded)fit()},250));
  // Prevent Safari's native long-press/gesture behavior over the drawing area.
  document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
  document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
  document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});
})();
</script>
</body>
</html>
